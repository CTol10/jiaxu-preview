<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><defs><filter id="p"><feTurbulence baseFrequency=".6" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="multiply"/></filter></defs><rect width="800" height="600" fill="#c7b99f"/><g transform="translate(114,50) rotate(5 250 250)"><rect x="0" y="0" width="540" height="496" fill="#eee4cc"/><path d="M38 45H505V450H38Z" fill="none" stroke="#ad6c53" stroke-width="2"/><g stroke="#cda68a" stroke-width="1"><path d="M458 45V450M414 45V450M370 45V450M326 45V450M282 45V450M238 45V450M194 45V450M150 45V450M106 45V450M62 45V450"/></g><g font-family="KaiTi,serif" font-size="25" fill="#4d4639" writing-mode="tb"><text x="482" y="68">家人平安 见字如面</text><text x="438" y="70">岁月虽远 故乡仍在心间</text><text x="394" y="70">每逢佳节 想起家门前的榕树</text><text x="350" y="70">和院里长辈们的声音</text><text x="306" y="70">盼将这些往事留给后来的孩子</text><text x="218" y="180">家书一页 寄予牵挂</text><text x="130" y="260">示意文稿</text></g><rect x="440" y="375" width="47" height="47" fill="none" stroke="#a95442" stroke-width="3"/><text x="463" y="405" text-anchor="middle" font-size="25" fill="#a95442" font-family="serif">林</text></g><rect width="800" height="600" opacity=".035" filter="url(#p)"/></svg>
